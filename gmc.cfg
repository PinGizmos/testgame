#config_version=6

[keyboard]
s=["switch", "s_start"]
l=["switch", "s_launch_button"]
x=["switch", "s_popbumper"]
z=["switch", "s_left_flipper"]
"/"=["switch", "s_right_flipper"]
shift+1=["switch", "s_trough1", "toggle"]
d=["switch", "s_left_outlane"]
f=["switch", "s_left_inlane"]
g=["switch", "s_right_inlane"]
h=["switch", "s_right_outlane"]
1=["switch", "s_standup_1"]
2=["switch", "s_standup_2"]
3=["switch", "s_standup_3"]
4=["switch", "s_trough4", "toggle"]
equals=["switch", "s_up"]
minus=["switch", "s_down"]
t=["switch", "s_plumb_bob"]
shift+t=["switch", "s_slam_tilt"]
enter=["switch", "s_coin_door_closed", "toggle"]
up=["switch", "s_up"]
down=["switch", "s_down"]
left=["switch", "s_esc"]
right=["switch", "s_enter"]
ctrl+5=["switch", "s_esc"]
k=["event", "do_knockdown"]
n=["event", "mode2_start"]
m=["event", "mode2_stop"]
o=["event", "servo_sequence"]
e=["event", "start_high_score"]

[sound_system]
music={"type": "solo"}
effects={"type": "simultaneous", "simultaneous_sounds": 3, "default": true}
voice={"type": "sequential"}
